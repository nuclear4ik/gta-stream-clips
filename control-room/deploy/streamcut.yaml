apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: streamcut-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamcut
  labels:
    app.kubernetes.io/name: streamcut
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: streamcut
  template:
    metadata:
      labels:
        app.kubernetes.io/name: streamcut
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: streamcut
          image: streamcut:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: streamcut-secrets
                optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "2"
              memory: 3Gi
          startupProbe:
            exec:
              command:
                - python
                - -c
                - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8765/healthz', timeout=2).close()"
            timeoutSeconds: 3
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8765/healthz', timeout=2).close()"
            timeoutSeconds: 3
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8765/healthz', timeout=2).close()"
            timeoutSeconds: 3
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/streamcut
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: streamcut-data
        - name: tmp
          emptyDir: {}
